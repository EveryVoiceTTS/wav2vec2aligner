[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ctc-segmentation-aligner"
dynamic = ["version"]
description = "Module for performing zero-shot forced alignment"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8, <3.13"
authors = [
    { name = "Aidan Pine", email = "hello@aidanpine.ca" },
    { name = "Eric Joanis", email = "Eric.Joanis@nrc-cnrc.gc.ca" },
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "g2p>=1.0.20230417",
    "pydub>=0.23.1",
    "pympi-ling",
    "rich>=10.11.0",
    "shellingham>=1.3.0",
    "soundfile>=0.10.2",
    "torch>=2.1.0,<2.8",
    "torchaudio>=2.1.0,<2.8",
    "tqdm",
    "typer>=0.15.3",
]

[project.scripts]
ctc-segmenter = "aligner.cli:app"

[tool.hatch.version]
path = "aligner/_version.py"

[tool.hatch.build.targets.sdist]
include = ["/aligner"]

[tool.hatch.build.targets.wheel]
include = ["/aligner"]

[project.optional-dependencies]
dev = [
  "black~=24.3",
  "coverage",
  "flake8>=4.0.1",
  "gitlint-core>=0.19.0",
  "isort>=5.10.1",
  "mypy>=1.8.0",
  "pre-commit>=3.2.0",
  "pytest",
  "pytest-subtests",
]
test=["pytest", "pytest-subtests"]

[tool.hatch.envs.hatch-test]
default-args = ["aligner/tests"]
features = ["test"]

# Run the matrix test with: uvx --with "virtualenv<20.31" hatch'<1.15' test -a
[[tool.hatch.envs.hatch-test.matrix]]
python = ["3.8", "3.9", "3.10", "3.11", "3.12"]


[project.urls]
Homepage = "https://github.com/EveryVoiceTTS/wav2vec2aligner"
Repository = "https://github.com/EveryVoiceTTS/wav2vec2aligner"
Issues = "https://github.com/EveryVoiceTTS/wav2vec2aligner/issues"
